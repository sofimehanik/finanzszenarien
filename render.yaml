services:
  # Backend Service
  - type: web
    name: finanzszenarien-backend
    env: python
    region: frankfurt  # или другой регион ближе к вам
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: finanzszenarien-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false  # Нужно будет установить вручную после деплоя фронтенда
      - key: PORT
        value: 8000
      - key: OPENAI_API_KEY
        sync: false  # Опционально, установите вручную если нужно
      - key: GEMINI_API_KEY
        sync: false  # Опционально, установите вручную если нужно
      - key: LLM_PROVIDER
        value: openai  # или gemini
    healthCheckPath: /api/health

  # Frontend Service
  - type: web
    name: finanzszenarien-frontend
    env: node
    region: frankfurt  # или другой регион ближе к вам
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Нужно будет установить вручную после деплоя бэкенда
    healthCheckPath: /

databases:
  # PostgreSQL Database
  - name: finanzszenarien-db
    plan: free
    databaseName: finanzszenarien
    user: finanzszenarien_user

